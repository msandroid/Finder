[project]
name = "jp-property-finder"
version = "1.0.0"
description = "日本全国対応・不動産および土地網羅検索プラットフォーム（Claude / Codex / Antigravity ネイティブ連携対応）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "mcp>=1.2.0",
    "pydantic>=2.9.0",
    "websockets>=13.1",
]

[project.scripts]
propfinder = "cli:main"
propfinder-mcp = "mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
