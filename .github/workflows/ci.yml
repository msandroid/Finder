name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm test は dist/ を作り直してからテストする
      - run: npm test
      - name: dist/ がコミット済みのソースと一致するか
        run: git diff --exit-code -- dist/ || (echo "npm run bundle を実行して dist/ をコミットしてください" && exit 1)
